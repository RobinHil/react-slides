name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Build the test container
        run: docker compose -f docker/compose.test.yml build test

      - name: Run the unit, end-to-end and visual tests
        env:
          CI: "true"
        run: docker compose -f docker/compose.test.yml run --rm test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  release:
    name: Publish the release
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm exec vite build --base=./

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: pip install -r docs/requirements.txt

      - run: pnpm docs:build

      - name: Package the site
        run: cd dist && zip -r "../react-slides-${GITHUB_REF_NAME#v}.zip" .

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "react-slides-${GITHUB_REF_NAME#v}.zip" --title "$GITHUB_REF_NAME" --generate-notes
