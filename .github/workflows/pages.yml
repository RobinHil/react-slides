name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Build the test container
        run: docker compose -f docker/compose.test.yml build test

      - name: Run the unit, end-to-end and visual tests
        env:
          CI: "true"
        run: docker compose -f docker/compose.test.yml run --rm test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  build:
    name: Build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      decks: ${{ steps.assert.outputs.decks }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - uses: actions/configure-pages@v6
        id: pages

      - name: Build the static site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          base="${BASE_PATH%/}/"
          echo "base: $base"
          SITE_URL="${BASE_URL%/}/" pnpm exec vite build --base="$base"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: pip install -r docs/requirements.txt

      - name: Build the documentation
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: SITE_URL="${BASE_URL%/}/" pnpm docs:build

      - name: Assert the build is complete
        id: assert
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          base="${BASE_PATH%/}/"
          decks=$(find src/decks -mindepth 2 -maxdepth 2 -name Deck.jsx | cut -d/ -f3 | sort | tr '\n' ' ')
          test -n "$decks" || { echo "no deck in src/decks"; exit 1; }
          echo "decks: $decks"
          cd dist

          test -f index.html || { echo "missing: index.html"; exit 1; }
          grep -q "<title>React Slides</title>" index.html
          grep -q 'rel="icon"' index.html || { echo "missing: favicon link"; exit 1; }
          grep -rq "$base" assets/*.js || { echo "base $base missing from the bundle"; exit 1; }

          for deck in $decks; do
            page="$deck/index.html"
            test -f "$page" || { echo "missing: $page"; exit 1; }
            grep -q "<meta name=\"deck\" content=\"$deck\"" "$page" || { echo "missing: deck meta in $page"; exit 1; }
            grep -q 'property="og:image"' "$page" || { echo "missing: og:image in $page"; exit 1; }
            test -s "$deck/preview.png" || { echo "missing: $deck/preview.png"; exit 1; }
          done

          for page in index.html */index.html; do
            for asset in $(grep -oE "(src|href)=\"[^\"]*assets/[^\"]*\"" "$page" | cut -d'"' -f2); do
              relative=".${asset#"${base%/}"}"
              test -f "$relative" || { echo "dangling asset in $page: $asset"; exit 1; }
            done
          done

          for page in docs/index.html docs/en/index.html docs/fr/index.html; do
            test -f "$page" || { echo "missing: $page"; exit 1; }
          done
          grep -q '<link rel="canonical" href="'"$BASE_URL" docs/en/index.html || { echo "documentation not built for $BASE_URL"; exit 1; }

          echo "decks=$decks" >> "$GITHUB_OUTPUT"
          echo "dist is complete:"
          du -sh .

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Verify what is published
    if: github.event_name != 'pull_request'
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch the published pages
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
          DECKS: ${{ needs.build.outputs.decks }}
        run: |
          set -euo pipefail
          site="${SITE%/}"
          echo "site: $site"

          for attempt in 1 2 3 4 5; do
            if curl -fsS "$site/" -o /tmp/index.html; then break; fi
            echo "attempt $attempt failed, waiting"
            sleep 10
          done

          grep -q "<title>React Slides</title>" /tmp/index.html
          origin=$(echo "$site" | grep -oE "^https?://[^/]+")
          script=$(grep -oE "src=\"[^\"]*assets/[^\"]*\.js\"" /tmp/index.html | head -1 | cut -d'"' -f2)
          curl -fsS -o /dev/null "$origin$script"

          for language in en fr; do
            curl -fsS "$site/docs/$language/" -o /tmp/docs.html
            grep -q "<html lang=\"$language\"" /tmp/docs.html || { echo "wrong documentation page for $language"; exit 1; }
            echo "verified $site/docs/$language/"
          done

          for deck in $DECKS; do
            curl -fsS "$site/$deck/" -o /tmp/deck.html
            grep -q "<meta name=\"deck\" content=\"$deck\"" /tmp/deck.html || { echo "wrong page for $deck"; exit 1; }
            image=$(grep -oE 'property="og:image" content="[^"]*"' /tmp/deck.html | cut -d'"' -f4)
            curl -fsS -o /dev/null "$image" || { echo "unreachable preview for $deck: $image"; exit 1; }
            echo "verified $site/$deck/"
          done

          echo "verified $site"
