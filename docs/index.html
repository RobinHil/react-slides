<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Slides documentation</title>
    <script>
      const language = navigator.languages.map((lang) => lang.split("-")[0].toLowerCase()).find((lang) => lang==="en" || lang==="fr") ?? "en";
      location.replace(`${language}/`);
    </script>
  </head>
  <body>
    <p><a href="en/">English documentation</a> · <a href="fr/">Documentation en français</a></p>
  </body>
</html>
